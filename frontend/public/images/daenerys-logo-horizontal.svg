<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Daenerys Burgers & Burritos">
  <!-- fondo -->
  <rect x="4" y="4" width="632" height="232" rx="116" fill="#FFF4E4"/>
  <rect x="4" y="4" width="632" height="232" rx="116" fill="none" stroke="#2B1B12" stroke-width="6"/>

  <!-- corona (Daenerys) -->
