    <path d="M-42,26 L-42,-6 L-22,8 L0,-22 L22,8 L42,-6 L42,26 Z"
          fill="#D9A441" stroke="#2B1B12" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="-30" r="7" fill="#D64541" stroke="#2B1B12" stroke-width="4"/>
    <circle cx="-42" cy="-12" r="6" fill="#4C9A2A" stroke="#2B1B12" stroke-width="4"/>
    <circle cx="42" cy="-12" r="6" fill="#4C9A2A" stroke="#2B1B12" stroke-width="4"/>
  </g>

  <!-- nombre -->
  <text x="320" y="180" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="72" letter-spacing="5" fill="#2B1B12">DAENERYS</text>

  <!-- subtítulo -->
  <text x="320" y="216" text-anchor="middle"
        font-family="Arial, sans-serif" font-weight="700"
        font-size="24" letter-spacing="7" fill="#B3541E">BURGERS &amp; BURRITOS</text>
